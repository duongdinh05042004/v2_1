services:
  sync-app:
    build: .
    container_name: sheets-bitrix24-sync
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./credentials:/app/credentials:ro
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
